# Build the Windows setup.exe (PyInstaller + Inno Setup) on a Windows runner.
#
# Trigger manually: Actions → Windows installer → Run workflow
# Or push to a branch matching cursor/** (draft agent builds).

name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "cursor/**"
    paths:
      - "checkmate/**"
      - "scripts/**"
      - "installer/**"
      - "pyproject.toml"
      - "uv.lock"
      - "run.py"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (incl. PyInstaller)
        run: uv sync --extra dev

      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\build_installer.ps1

      - name: Upload setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: CheckMate-windows-setup
          path: installer/Output/CheckMate-*-setup.exe
          if-no-files-found: error
          retention-days: 14
