[project]
name = "ebraille-checker-gui"
version = "0.1.0"
description = "Accessible cross-platform GUI for the DAISY eBraille Checker"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ways2read" }]
keywords = ["ebraille", "accessibility", "epub", "validation", "daisy"]
dependencies = [
    "wxPython>=4.2.0",
    "requests>=2.31.0",
    "packaging>=23.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
]

[project.urls]
Homepage = "https://github.com/ways2read/ebraille-checker-gui"
Issues = "https://github.com/ways2read/ebraille-checker-gui/issues"
Upstream = "https://github.com/daisy/ebraille-checker"

[project.scripts]
ebraille-checker-gui = "app.main:run_app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
