[project]
name = "checkmate"
version = "0.7.17"
description = "CheckMate — accessible cross-platform GUI for the DAISY eBraille Checker, W3C EPUBCheck, and veraPDF"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ways2read" }]
keywords = ["ebraille", "epub", "epubcheck", "accessibility", "validation", "daisy", "checkmate"]
dependencies = [
    "wxPython>=4.2.0",
    "requests>=2.31.0",
    "packaging>=23.0",
    "pymupdf>=1.24.0",
    "litellm>=1.50.0",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
]

[project.urls]
Homepage = "https://github.com/ways2read/checkmate"
Issues = "https://github.com/ways2read/checkmate/issues"
Upstream = "https://github.com/daisy/ebraille-checker"

[project.scripts]
checkmate = "checkmate.main:run_app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["checkmate*"]
